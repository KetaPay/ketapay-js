# Publishes a tagged release to npm. Manual only: Actions tab > "Publish to npm" > Run workflow.
# Only dudox can run it, and only while the repo variable NPM_PUBLISH_ENABLED=true.
#
# 1. Resolves the release tag (the latest GitHub release unless you give one), checks it is on main,
#    matches package.json and isn't on npm yet.
# 2. Runs the whole CI suite and the E2E suite on that exact tag (E2E is required for stable releases).
# 3. Builds, smoke-tests the packed package, and publishes it: versions with a pre-release suffix
#    (0.1.0-beta.1) under the `next` dist-tag, others under `latest`.
#
# 3b. Uploads the script tag build to js.ketapay.com (stack ketapay-js-cdn, infra/cdn.yml) before npm:
#     /v1.2.3/checkout.js (never changed again) and, for stable releases, /v1/checkout.js. Needs the
#     CDN_UPLOAD_ROLE_ARN from Infisical (ketapay-sdks, prod; the stack's UploadRoleArn output); without it,
#     npm only.
#
# Auth: NPM_TOKEN from Infisical (ketapay-sdks, prod) when set, otherwise npm Trusted Publishing.
# Provenance is on: npm links each version to the exact workflow run and commit that built it.
# The publish job runs in the `publish` environment, which needs dudox's approval before it starts.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, like v0.1.0-beta.1 (empty = the latest release)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Who, what and whether
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - name: Only dudox can publish, and only when publishing is enabled
        env:
          ACTOR: ${{ github.actor }}
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
        run: |
          if [ "$ACTOR" != "dudox" ]; then echo "::error::Only dudox can publish to npm ($ACTOR tried)."; exit 1; fi
          if [ "$ENABLED" != "true" ]; then echo "::error::Publishing is switched off (NPM_PUBLISH_ENABLED is not true)."; exit 1; fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Resolve the release
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${INPUT_TAG:-$(gh release view --json tagName -q .tagName)}"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "::error::No tag $tag."; exit 1; fi
          if ! git merge-base --is-ancestor "$tag" origin/main; then echo "::error::$tag is not on main."; exit 1; fi
          version=$(git show "$tag:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          if [ "$tag" != "v$version" ]; then echo "::error::$tag does not match package.json version $version."; exit 1; fi
          if npm view "@ketapay/checkout@$version" version >/dev/null 2>&1; then echo "::error::@ketapay/checkout@$version is already on npm."; exit 1; fi
          if [[ "$version" == *-* ]]; then dist_tag=next; else dist_tag=latest; fi
          { echo "tag=$tag"; echo "version=$version"; echo "dist_tag=$dist_tag"; } >> "$GITHUB_OUTPUT"
          echo "### Publishing @ketapay/checkout@$version as \`$dist_tag\` from \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Full CI on the release tag
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  e2e:
    name: E2E on the release tag
    needs: prepare
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      id-token: write
    with:
      ref: ${{ needs.prepare.outputs.tag }}
      # Stable releases must pass E2E; betas run it when staging is configured.
      required: ${{ needs.prepare.outputs.dist_tag == 'latest' }}

  publish:
    name: Publish
    environment: publish # requires dudox's approval (repo settings > Environments)
    needs: [prepare, checks, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Infisical login and Trusted Publishing
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: 'oidc'
          oidc-audience: 'https://infisical.com'
          identity-id: 'ef5c6cbd-0f7e-49a9-a6b7-8d115c2abbd2'
          project-slug: 'ketapay-sdks-pz5w' # one Infisical project for every KetaPay SDK
          env-slug: 'prod'
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: npm with Trusted Publishing support
        run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run build
      - name: Smoke test the exact package being published
        run: npm run smoke:pack
      # js.ketapay.com (stack ketapay-js-cdn, infra/cdn.yml). Before npm, so a failed upload publishes nothing.
      - name: Sign in to AWS for the CDN
        if: env.CDN_UPLOAD_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.CDN_UPLOAD_ROLE_ARN }} # from Infisical
          aws-region: us-east-1
      - name: Upload to js.ketapay.com
        if: env.CDN_UPLOAD_ROLE_ARN != ''
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          out() { aws cloudformation describe-stacks --stack-name ketapay-js-cdn --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          bucket=$(out BucketName); distribution=$(out DistributionId)
          major="v${VERSION%%.*}"
          put() { # key, file, content type, cache-control
            aws s3api put-object --bucket "$bucket" --key "$1" --body "$2" --content-type "$3" --cache-control "$4" >/dev/null
          }
          put_new() { # same, but refused by S3 if the key already exists
            aws s3api put-object --bucket "$bucket" --key "$1" --body "$2" --content-type "$3" --cache-control "$4" --if-none-match '*' >/dev/null
          }
          # Published versions never change: if this version is already there it must be the same bytes
          # (a re-run after a failed npm publish), otherwise stop.
          for file in checkout.js checkout.js.map; do
            key="v$VERSION/$file"
            type=$([ "$file" = checkout.js ] && echo 'text/javascript; charset=utf-8' || echo application/json)
            if aws s3api head-object --bucket "$bucket" --key "$key" >/dev/null 2>&1; then
              aws s3 cp "s3://$bucket/$key" "/tmp/$file" --quiet
              cmp -s "/tmp/$file" "dist/$file" || { echo "::error::$key is already published with different contents."; exit 1; }
            else
              put_new "$key" "dist/$file" "$type" 'public, max-age=31536000, immutable'
            fi
          done
          # /v1/checkout.js follows the newest stable 1.x; pre-releases only get their exact path.
          if [ "$DIST_TAG" = latest ]; then
            put "$major/checkout.js" dist/checkout.js 'text/javascript; charset=utf-8' 'public, max-age=300'
            put "$major/checkout.js.map" dist/checkout.js.map application/json 'public, max-age=300'
            aws cloudfront create-invalidation --distribution-id "$distribution" --paths "/$major/*" --query Invalidation.Id --output text
          fi
          # What shops will load, straight from the CDN
          curl -fsS "https://js.ketapay.com/v$VERSION/checkout.js" | cmp -s - dist/checkout.js || { echo "::error::js.ketapay.com/v$VERSION/checkout.js doesn't serve this build."; exit 1; }
          {
            echo "### js.ketapay.com"
            echo
            echo "- https://js.ketapay.com/v$VERSION/checkout.js"
            [ "$DIST_TAG" = latest ] && echo "- https://js.ketapay.com/$major/checkout.js (cache refreshes within 5 minutes)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: CDN not set up
        if: env.CDN_UPLOAD_ROLE_ARN == ''
        run: echo "::warning::CDN_UPLOAD_ROLE_ARN is not in Infisical (ketapay-sdks, prod), so js.ketapay.com was not updated (npm only)."
      - name: Publish (Trusted Publishing)
        if: env.NPM_TOKEN == ''
        run: npm publish --tag ${{ needs.prepare.outputs.dist_tag }}
      - name: Publish (npm token from Infisical)
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --tag ${{ needs.prepare.outputs.dist_tag }}
          rm ~/.npmrc
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          {
            echo "### Published @ketapay/checkout@$VERSION"
            echo
            echo "Install: \`npm install @ketapay/checkout@$DIST_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
