# Checks, without publishing, that the release job can read its secrets from Infisical and that the
# npm token is valid. Run it from the Actions tab before a release, or after rotating NPM_TOKEN.
name: Check release secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: 'oidc'
          oidc-audience: 'https://infisical.com'
          identity-id: 'ef5c6cbd-0f7e-49a9-a6b7-8d115c2abbd2'
          project-slug: 'ketapay-sdks-pz5w' # one Infisical project for every KetaPay SDK
          env-slug: 'prod'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm token is present and valid
        run: |
          if [ -z "$NPM_TOKEN" ]; then echo "::error::NPM_TOKEN missing from Infisical prod"; exit 1; fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "npm user: $(npm whoami)"
          rm ~/.npmrc
